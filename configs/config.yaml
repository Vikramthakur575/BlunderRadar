# Global BlunderRadar Configuration
project_name: "BlunderRadar"
random_seed: 42

data:
  # Lichess open database dump URL or local file path
  source_url: "https://database.lichess.org/standard/lichess_db_standard_rated_2024-01.pgn.zst"
  local_zst_path: "data/raw/lichess_sample.pgn.zst"
  output_parquet_dir: "data/processed/positions.parquet"
  checkpoint_file: "data/processed/pipeline_state.json"
  quality_report_md: "data/data_quality_report.md"
  quality_report_json: "data/data_quality_report.json"
  
  target_positions: 300000
  sample_batch_size: 5000
  
  # Rating and Time Control Filters
  min_rating: 800
  max_rating: 2400
  allowed_speeds: ["blitz", "rapid"]
  
  # Blunder & Evaluation Definition
  blunder_threshold_cp: 200.0
  mate_score_cp: 10000.0
  dead_lost_threshold_cp: -800.0  # Moves in already hopeless positions (<= -800 cp) are not blunders
  ignore_dead_lost: true
  win_prob_scaling: 400.0
  win_prob_blunder_threshold: 0.15
  clearly_winning_threshold: 0.80
  dead_lost_threshold_prob: 0.02

features:
  include_eval_before: true
  time_pressure_threshold_seconds: 30.0

model:
  target_col: "is_blunder"
  test_size: 0.15
  val_size: 0.15
  cv_folds: 5
  rating_bands:
    low: [800, 1200]
    mid: [1200, 1800]
    high: [1800, 2400]
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "blunder_radar_experiments"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/best_model.pkl"

streaming:
  kafka_bootstrap_servers: "localhost:9092"
  input_topic: "chess_game_moves"
  output_topic: "blunder_risk_scores"
  db_path: "data/live_game_scores.db"
